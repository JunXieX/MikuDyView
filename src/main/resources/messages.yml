# MikuDyView 消息，使用 MiniMessage。占位符一律小写，例如 <world>。
status:
  header: "<aqua>===== MikuDyView ====="
  summary: "<gray>模式 <white><mode></white> | MSPT <white><mspt></white> | 空闲堆 <white><mem>%</white> | 开关 <white><enabled>"
  world: "<yellow><world></yellow> <gray>sim <white><sim></white> view <white><view></white> | 玩家 <white><players></white> | 下次 <white><next>s<flags>"
  flags:
    excluded: " (excluded)"
    contested: " (contested)"
    override: " (override)"
  none: "<gray>没有正在管理的世界。"

history:
  header: "<aqua>===== 最近 <count> 条变更 ====="
  entry: "<gray><time> <yellow><world></yellow> <gray>sim <white><oldsim></white>-><white><newsim></white> view <white><oldview></white>-><white><newview>"
  reason: "  <dark_gray>原因：<reason>"
  empty: "<gray>暂无变更记录。"

simulate:
  header: "<aqua>===== 预演：<world> ====="
  entry: "<yellow><world></yellow> <gray>当前 <white><sim>/<view></white> -> 目标 <white><targetsim>/<targetview></white> <gray>[<verdict><gray>]"
  reason: "  <dark_gray>原因：<reason>"
  empty: "<gray>没有可预演的世界。"

set:
  ok: "<green>已设置 <white><world></white> 的 <white><type></white> 为 <white><value></white>（保持到下次 reload）。"
  invalid: "<red>距离必须在 2-32 之间。"

world:
  not-found: "<red>找不到世界：<world>"

reload:
  ok: "<green>配置已重新加载。"

toggle:
  on: "<green>自动调节已开启（已写入配置文件）。"
  off: "<yellow>自动调节已关闭（已写入配置文件）。"

no-permission: "<red>你没有权限。"
player-only: "<red>该命令只能由玩家执行。"
